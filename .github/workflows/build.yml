name: build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Targets to build
        type: choice
        options: [all, linux, windows]
        default: all
      ref:
        description: bloomberg/clang-p2996 branch, tag or commit
        type: string
        default: p2996
      release:
        description: Publish a GitHub release when the build succeeds
        type: boolean
        default: true
  schedule:
    # Mondays 03:00 UTC; builds only when upstream p2996 has an unreleased commit.
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      linux: ${{ steps.v.outputs.linux }}
      windows: ${{ steps.v.outputs.windows }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || 'p2996' }}
          TARGETS: ${{ inputs.targets || 'all' }}
          RELEASE: ${{ github.event_name == 'schedule' || inputs.release }}
        run: |
          set -eu
          json=$(gh api "repos/bloomberg/clang-p2996/commits/$REF")
          sha=$(echo "$json" | jq -r .sha)
          date=$(echo "$json" | jq -r .commit.committer.date | cut -c1-10 | tr -d -)
          version="$date-$(echo "$sha" | cut -c1-10)"
          tag="p2996-$version"
          if [ "$GITHUB_EVENT_NAME" = schedule ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is already released; nothing to build"
            TARGETS=none
          fi
          linux=false; windows=false
          case "$TARGETS" in
            all) linux=true; windows=true ;;
            linux) linux=true ;;
            windows) windows=true ;;
          esac
          {
            echo "sha=$sha"; echo "version=$version"; echo "tag=$tag"
            echo "linux=$linux"; echo "windows=$windows"; echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$tag linux=$linux windows=$windows release=$RELEASE"

  linux:
    needs: prepare
    if: needs.prepare.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build Docker image
        run: docker build -t clang-p2996-linux -f docker/linux.Dockerfile docker
      - name: Build
        run: docker run --rm -v "$PWD:/work" -w /work clang-p2996-linux scripts/build-linux.sh "${{ needs.prepare.outputs.sha }}" /work/out
      - name: Smoke test on the runner (newer distro than the build image)
        run: scripts/smoke-test-linux.sh out/*.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: out/*.tar.xz
          compression-level: 0
          retention-days: 7

  windows:
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build Docker image
        run: docker build -t clang-p2996-windows -f docker/windows.Dockerfile docker
      - name: Build
        run: docker run --rm -v "$PWD:/work" -w /work clang-p2996-windows scripts/build-windows.sh "${{ needs.prepare.outputs.sha }}" /work/out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-ucrt
          path: out/*.zip
          compression-level: 0
          retention-days: 7

  windows-test:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-ucrt
          path: dist
      - name: Compile and run a reflection program
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          7z x $zip.FullName -otc | Out-Null
          $root = (Get-ChildItem tc -Directory | Select-Object -First 1).FullName
          $env:PATH = "$root\bin;$root\x86_64-w64-mingw32\bin;$env:PATH"
          clang++ --version
          clang++ -std=c++26 -freflection -fexpansion-statements tests/reflection-smoke.cpp -o smoke.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./smoke.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          clang++ -std=c++26 -freflection-latest tests/reflection-smoke.cpp -o smoke-latest.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./smoke-latest.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

  release:
    needs: [prepare, linux, windows, windows-test]
    if: ${{ !cancelled() && !failure() && needs.prepare.outputs.release == 'true' && (needs.linux.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          cat > notes.md <<'EOF'
          Unofficial build of [bloomberg/clang-p2996](https://github.com/bloomberg/clang-p2996) at commit [@SHA@](https://github.com/bloomberg/clang-p2996/commit/@SHA@).

          | Package | Runs on | Produces |
          |---|---|---|
          | `*-x86_64-linux-gnu.tar.xz` | x86_64 Linux, glibc 2.31+ | x86_64 Linux programs, libc++ by default |
          | `*-x86_64-w64-mingw32-ucrt.zip` | x86_64 Windows | x86_64 Windows programs (mingw-w64, UCRT, libc++) |

          Usage: `clang++ -std=c++26 -freflection main.cpp` (P2996 only) or `-freflection-latest` (all experimental reflection features of the fork).

          The fork is experimental; do not use it for production artifacts.
          EOF
          sed -i "s/@SHA@/$SHA/g" notes.md
          ls -l dist
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "clang-p2996 $TAG" --notes-file notes.md
          fi
